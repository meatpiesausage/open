<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      h1 {
        text-align: center;
        padding: 10px;
        font-size: 1.2rem;
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
        flex-shrink: 0;
      }

      #login-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1000;
      }

      #game-container {
        width: 100vw;
        height: 50vh;
        border-bottom: 2px solid #333;
        position: relative;
        overflow: hidden;
        background-color: #f0f0f0;
        flex-shrink: 0;
      }

      .player {
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        transition: left 0.1s, top 0.1s;
        overflow: hidden;
      }

      .player-background {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0%, transparent 100%);
      }

      .player-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }

      /* Life indicator styles */
      .life-4 .player-background {
        background: conic-gradient(
          from -90deg,
          var(--player-color) 0%,
          var(--player-color) 100%
        );
      }

      .life-3 .player-background {
        background: conic-gradient(
          from -90deg,
          var(--player-color) 0%,
          var(--player-color) 75%,
          #ddd 75%,
          #ddd 100%
        );
      }

      .life-2 .player-background {
        background: conic-gradient(
          from -90deg,
          var(--player-color) 0%,
          var(--player-color) 50%,
          #ddd 50%,
          #ddd 100%
        );
      }

      .life-1 .player-background {
        background: conic-gradient(
          from -90deg,
          var(--player-color) 0%,
          var(--player-color) 25%,
          #ddd 25%,
          #ddd 100%
        );
      }

      .life-0 .player-background {
        background: #ddd;
      }

      .player.inactive {
        opacity: 0.5;
        border: 2px dashed #666;
      }

      .player.inactive .player-background {
        background: #ccc !important;
      }

      .speech-bubble {
        position: absolute;
        background-color: white;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 8px 12px;
        max-width: 150px;
        word-wrap: break-word;
        font-size: 12px;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .speech-bubble.show {
        opacity: 1;
      }

      .speech-bubble::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: white;
      }

      .speech-bubble::before {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 10px solid transparent;
        border-top-color: #333;
        z-index: -1;
      }

      #error-message {
        color: red;
        margin-top: 10px;
        display: none;
      }

      #bottom-section {
        height: 50vh;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        background-color: #f8f9fa;
      }

      #controls {
        display: none;
        text-align: center;
        padding: 15px;
        background-color: white;
        border-bottom: 1px solid #dee2e6;
        flex-shrink: 0;
      }

      #controls button {
        margin: 3px;
        padding: 12px 16px;
        font-size: 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        min-width: 60px;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        transition: background-color 0.1s;
      }

      #controls button:hover {
        background-color: #0056b3;
      }

      #controls button:active,
      #controls button.pressed {
        background-color: #004494;
        transform: scale(0.95);
      }

      #chat-container {
        display: none;
        padding: 15px;
        background-color: white;
        border-bottom: 1px solid #dee2e6;
        flex-shrink: 0;
      }

      #chat-input {
        width: calc(100% - 80px);
        padding: 10px;
        margin-right: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }

      #send-button {
        padding: 10px 16px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      #send-button:hover {
        background-color: #218838;
      }

      #players-list {
        display: none;
        padding: 15px;
        flex: 1;
        overflow-y: auto;
      }

      #players-list h3 {
        margin-bottom: 10px;
        color: #333;
      }

      .player-item {
        margin: 8px 0;
        padding: 8px;
        background-color: white;
        border-radius: 4px;
        border: 1px solid #e9ecef;
        font-size: 14px;
      }

      .player-item.inactive {
        opacity: 0.6;
        font-style: italic;
        background-color: #f8f9fa;
      }

      .life-indicator {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        margin-left: 5px;
        vertical-align: middle;
      }

      .door {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 40px;
        height: 60px;
        background-color: #8b4513;
        border: 2px solid #654321;
        border-radius: 5px 5px 0 0;
        z-index: 100;
        display: none;
        transition: opacity 0.3s ease;
      }

      .door::before {
        content: "";
        position: absolute;
        top: 25px;
        right: 8px;
        width: 4px;
        height: 4px;
        background-color: #ffd700;
        border-radius: 50%;
      }

      .door.show {
        display: block;
        opacity: 1;
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        h1 {
          font-size: 1rem;
          padding: 8px;
        }

        .player {
          width: 35px;
          height: 35px;
          font-size: 12px;
        }

        #controls {
          padding: 10px;
        }

        #controls button {
          padding: 10px 14px;
          margin: 2px;
          font-size: 12px;
          min-width: 50px;
        }

        #chat-container {
          padding: 10px;
        }

        #chat-input {
          width: calc(100% - 70px);
          padding: 8px;
          font-size: 12px;
        }

        #send-button {
          padding: 8px 12px;
          font-size: 12px;
        }

        #players-list {
          padding: 10px;
        }

        .player-item {
          font-size: 12px;
          padding: 6px;
        }

        .speech-bubble {
          max-width: 120px;
          font-size: 11px;
          padding: 6px 8px;
        }

        .life-indicator {
          width: 14px;
          height: 14px;
        }
      }

      /* Very small screens */
      @media (max-width: 480px) {
        h1 {
          font-size: 0.9rem;
          padding: 6px;
        }

        .player {
          width: 30px;
          height: 30px;
          font-size: 11px;
        }

        #controls button {
          padding: 8px 10px;
          font-size: 11px;
          min-width: 45px;
        }

        .life-indicator {
          width: 12px;
          height: 12px;
        }
      }
    </style>
  </head>

  <body>
    <h1>Socket.IO Game with Persistent Characters</h1>

    <div id="login-container">
      <input
        type="text"
        id="username-input"
        placeholder="Enter your username"
      />
      <button id="join-button">Join Game</button>
      <div id="error-message"></div>
    </div>

    <div id="game-container" style="display: none"></div>

    <div id="bottom-section">
      <div id="controls" style="display: none">
        <button id="up-button">↑</button><br />
        <button id="left-button">←</button>
        <button id="right-button">→</button><br />
        <button id="down-button">↓</button>
      </div>

      <div id="chat-container">
        <input
          type="text"
          id="chat-input"
          placeholder="Type a message..."
          maxlength="100"
        />
        <button id="send-button">Send</button>
      </div>

      <div id="players-list" style="display: none">
        <h3>Players:</h3>
        <div id="players"></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Connect to Socket.IO server
      const socket = io();

      // DOM Elements
      const loginContainer = document.getElementById("login-container");
      const gameContainer = document.getElementById("game-container");
      const controls = document.getElementById("controls");
      const chatContainer = document.getElementById("chat-container");
      const chatInput = document.getElementById("chat-input");
      const sendButton = document.getElementById("send-button");
      const playersList = document.getElementById("players-list");
      const playersDiv = document.getElementById("players");
      const usernameInput = document.getElementById("username-input");
      const joinButton = document.getElementById("join-button");
      const errorMessage = document.getElementById("error-message");

      // Game variables
      let myUsername = null;
      let playerElements = {};
      let speechBubbles = {};
      const moveStep = 8;
      const moveInterval = 50; // milliseconds between moves when holding
      const playerColors = [
        "#ff4d4d",
        "#4da6ff",
        "#4dff4d",
        "#ffff4d",
        "#ff4dff",
        "#4dffc4",
        "#c44dff",
        "#ffa64d",
      ];
      // Door interaction variables
      let doorInteractionCooldown = {};
      const DOOR_INTERACTION_COOLDOWN = 1000; // 1 second cooldown per player
      let doorElement = null;

      // Movement state
      let movementInterval = null;
      let currentDirection = null;
      let isMoving = false;

      function checkDoorCollision(playerX, playerY, playerRadius = 20) {
        if (!doorElement || !doorElement.classList.contains("show"))
          return false;

        // Door position (from CSS: top: 20px, left: 20px)
        const doorX = 20 + 20; // left + width/2
        const doorY = 20 + 30; // top + height/2
        const doorWidth = 40;
        const doorHeight = 60;

        // Check if player circle intersects with door rectangle
        const distanceX = Math.abs(playerX - doorX);
        const distanceY = Math.abs(playerY - doorY);

        if (
          distanceX > doorWidth / 2 + playerRadius ||
          distanceY > doorHeight / 2 + playerRadius
        ) {
          return false;
        }

        if (distanceX <= doorWidth / 2 || distanceY <= doorHeight / 2) {
          return true;
        }

        const cornerDistance =
          Math.pow(distanceX - doorWidth / 2, 2) +
          Math.pow(distanceY - doorHeight / 2, 2);
        return cornerDistance <= Math.pow(playerRadius, 2);
      }

      // Add this function to handle door interaction
      function handleDoorInteraction(username, playerX, playerY) {
        const now = Date.now();

        // Check cooldown
        if (
          doorInteractionCooldown[username] &&
          now - doorInteractionCooldown[username] < DOOR_INTERACTION_COOLDOWN
        ) {
          return;
        }

        //Player hits the door and a message is sent back to the server to say which player hit the door.

        if (checkDoorCollision(playerX, playerY))
        {
          doorInteractionCooldown[username] = now;
          socket.emit("doorInteraction", { username, x: playerX, y: playerY });
          console.log(`${username} interacted with the door!`);

          // Visual feedback - make door glow briefly
          if (doorElement) {
            doorElement.style.boxShadow = "0 0 20px #FFD700";
            setTimeout(() => {
              if (doorElement) {
                doorElement.style.boxShadow = "";
              }
            }, 500);
          }
        }
      }

      // Hash function to consistently assign colors to usernames
      function hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          const char = str.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash = hash & hash; // Convert to 32-bit integer
        }
        return Math.abs(hash);
      }

      function getPlayerColor(username) {
        return playerColors[hashCode(username) % playerColors.length];
      }

      function createLifeIndicator(life, color) {
        const indicator = document.createElement("div");
        indicator.className = "life-indicator";

        let gradientStops;
        switch (life) {
          case 4:
            gradientStops = `conic-gradient(from -90deg, ${color} 0%, ${color} 100%)`;
            break;
          case 3:
            gradientStops = `conic-gradient(from -90deg, ${color} 0%, ${color} 75%, #ddd 75%, #ddd 100%)`;
            break;
          case 2:
            gradientStops = `conic-gradient(from -90deg, ${color} 0%, ${color} 50%, #ddd 50%, #ddd 100%)`;
            break;
          case 1:
            gradientStops = `conic-gradient(from -90deg, ${color} 0%, ${color} 25%, #ddd 25%, #ddd 100%)`;
            break;
          default:
            gradientStops = "#ddd";
            break;
        }

        indicator.style.background = gradientStops;
        return indicator;
      }

      // Movement functions
      function startMovement(direction) {
        if (isMoving && currentDirection === direction) return;

        stopMovement();
        currentDirection = direction;
        isMoving = true;

        // Add pressed class for visual feedback
        const buttonId = direction + "-button";
        document.getElementById(buttonId).classList.add("pressed");

        // Move immediately
        movePlayer(direction);

        // Set up continuous movement
        movementInterval = setInterval(() => {
          movePlayer(direction);
        }, moveInterval);
      }

      function stopMovement() {
        if (movementInterval) {
          clearInterval(movementInterval);
          movementInterval = null;
        }

        // Remove pressed class from all buttons
        ["up", "down", "left", "right"].forEach((dir) => {
          document.getElementById(dir + "-button").classList.remove("pressed");
        });

        currentDirection = null;
        isMoving = false;
      }

      function movePlayer(direction) {
        if (!playerElements[myUsername]) return;

        const player = playerElements[myUsername];
        const currentX = parseInt(player.style.left);
        const currentY = parseInt(player.style.top);

        let deltaX = 0,
          deltaY = 0;

        switch (direction) {
          case "up":
            deltaY = -moveStep;
            break;
          case "down":
            deltaY = moveStep;
            break;
          case "left":
            deltaX = -moveStep;
            break;
          case "right":
            deltaX = moveStep;
            break;
        }

        let newX = Math.max(
          20,
          Math.min(gameContainer.clientWidth - 20, currentX + deltaX)
        );
        let newY = Math.max(
          20,
          Math.min(gameContainer.clientHeight - 20, currentY + deltaY)
        );

        player.style.left = `${newX}px`;
        player.style.top = `${newY}px`;

        // Update speech bubble position if it exists
        if (speechBubbles[myUsername]) {
          updateSpeechBubblePosition(myUsername, newX, newY);
        }

        // Check for door interaction
        handleDoorInteraction(myUsername, newX, newY);

        socket.emit("updatePosition", { x: newX, y: newY });
      }

      // Add function to create floating text effects
      function createFloatingText(x, y, text) {
        const floatingText = document.createElement("div");
        floatingText.style.position = "absolute";
        floatingText.style.left = `${x}px`;
        floatingText.style.top = `${y - 80}px`;
        floatingText.style.color = "#FFD700";
        floatingText.style.fontWeight = "bold";
        floatingText.style.fontSize = "14px";
        floatingText.style.pointerEvents = "none";
        floatingText.style.zIndex = "1001";
        floatingText.style.textShadow = "1px 1px 2px rgba(0,0,0,0.7)";
        floatingText.style.transform = "translateX(-50%)";
        floatingText.style.transition = "all 2s ease-out";
        floatingText.textContent = text;

        gameContainer.appendChild(floatingText);

        // Animate the floating text
        setTimeout(() => {
          floatingText.style.top = `${y - 120}px`;
          floatingText.style.opacity = "0";
        }, 100);

        // Remove after animation
        setTimeout(() => {
          if (floatingText.parentNode) {
            gameContainer.removeChild(floatingText);
          }
        }, 2100);
      }

      // Join the game
      joinButton.addEventListener("click", () => {
        const username = usernameInput.value.trim();
        if (username) {
          socket.emit("playerJoin", username);
          errorMessage.style.display = "none";
        }
      });

      // Handle join errors
      socket.on("joinError", (message) => {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
      });

      // Add socket event listener for door interaction responses
      socket.on("doorInteractionResult", (data) => {
        console.log(`Door interaction by ${data.username}:`, data.message);

        // Create a special visual effect or message
        createSpeechBubble(data.username, `🚪 ${data.message}`);

        // You could also show a system message or special effect here
        if (data.effect) {
          // Handle special effects based on the server response
          switch (data.effect) {
            case "teleport":
              // Handle teleportation effect
              break;
            case "damage":
              // Handle damage effect
              break;
            case "reward":
              // Handle reward effect
              break;
          }
        }
      });

      // Add socket event for when any player interacts with door (for visual feedback)
      socket.on("playerInteractedWithDoor", (data) => {
        console.log(
          `${data.username} interacted with the door at (${data.x}, ${data.y})`
        );

        // Visual effect for all players to see
        if (doorElement) {
          doorElement.style.transform = "scale(1.1)";
          doorElement.style.transition = "transform 0.2s ease";

          setTimeout(() => {
            if (doorElement) {
              doorElement.style.transform = "scale(1)";
            }
          }, 200);
        }

        // Create floating text effect
        createFloatingText(
          data.x,
          data.y,
          `${data.username} touched the door!`
        );
      });

      // Chat functionality
      function sendMessage() {
        const message = chatInput.value.trim();
        if (message && myUsername) {
          socket.emit("chatMessage", message);
          chatInput.value = "";
        }
      }

      sendButton.addEventListener("click", sendMessage);
      chatInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      // Movement controls - Mouse events
      document
        .getElementById("up-button")
        .addEventListener("mousedown", () => startMovement("up"));
      document
        .getElementById("down-button")
        .addEventListener("mousedown", () => startMovement("down"));
      document
        .getElementById("left-button")
        .addEventListener("mousedown", () => startMovement("left"));
      document
        .getElementById("right-button")
        .addEventListener("mousedown", () => startMovement("right"));

      // Stop movement on mouse up or leave
      ["up", "down", "left", "right"].forEach((direction) => {
        const button = document.getElementById(direction + "-button");
        button.addEventListener("mouseup", stopMovement);
        button.addEventListener("mouseleave", stopMovement);
      });

      // Touch events for mobile
      ["up", "down", "left", "right"].forEach((direction) => {
        const button = document.getElementById(direction + "-button");

        button.addEventListener("touchstart", (e) => {
          e.preventDefault();
          startMovement(direction);
        });

        button.addEventListener("touchend", (e) => {
          e.preventDefault();
          stopMovement();
        });

        button.addEventListener("touchcancel", (e) => {
          e.preventDefault();
          stopMovement();
        });
      });

      // Global mouse up to ensure movement stops if mouse is released outside button
      document.addEventListener("mouseup", stopMovement);

      // Keyboard controls
      let pressedKeys = {};

      document.addEventListener("keydown", (e) => {
        if (!myUsername) return;

        // Don't move if user is typing in chat or username
        if (
          document.activeElement === chatInput ||
          document.activeElement === usernameInput
        )
          return;

        // Prevent repeating keydown events
        if (pressedKeys[e.key]) return;
        pressedKeys[e.key] = true;

        switch (e.key) {
          case "ArrowUp":
            startMovement("up");
            break;
          case "ArrowDown":
            startMovement("down");
            break;
          case "ArrowLeft":
            startMovement("left");
            break;
          case "ArrowRight":
            startMovement("right");
            break;
        }
      });

      document.addEventListener("keyup", (e) => {
        pressedKeys[e.key] = false;

        switch (e.key) {
          case "ArrowUp":
          case "ArrowDown":
          case "ArrowLeft":
          case "ArrowRight":
            stopMovement();
            break;
        }
      });

      // Stop movement when window loses focus
      window.addEventListener("blur", stopMovement);

      function updatePlayersList(players) {
        playersDiv.innerHTML = "";
        Object.keys(players).forEach((username) => {
          const player = players[username];
          const div = document.createElement("div");
          div.className = `player-item ${player.isActive ? "" : "inactive"}`;

          const status = player.isActive ? "Online" : "Offline";
          const timeAgo = player.lastSeen ? getTimeAgo(player.lastSeen) : "";
          const life = player.life || 4;

          const lifeIndicator = createLifeIndicator(
            life,
            getPlayerColor(username)
          );

          div.innerHTML = `
                    <span style="color: ${getPlayerColor(username)};">●</span>
                    <strong>${player.username}</strong> 
                    (${player.x}, ${player.y}) - 
                    <span style="color: ${
                      player.isActive ? "green" : "gray"
                    };">${status}</span>
                    ${!player.isActive && timeAgo ? ` - ${timeAgo}` : ""}
                    <span style="margin-left: 10px;">Life: ${life}/4</span>
                `;

          div.appendChild(lifeIndicator);
          playersDiv.appendChild(div);
        });
      }

      function getTimeAgo(timestamp) {
        const seconds = Math.floor((Date.now() - timestamp) / 1000);
        if (seconds < 60) return `${seconds}s ago`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;
        const hours = Math.floor(minutes / 60);
        return `${hours}h ago`;
      }

      function createPlayerElement(username, player) {
        const playerEl = document.createElement("div");
        const life = player.life || 4;
        const color = getPlayerColor(username);

        playerEl.className = `player life-${life} ${
          player.isActive ? "" : "inactive"
        }`;
        playerEl.style.left = `${player.x}px`;
        playerEl.style.top = `${player.y}px`;
        playerEl.style.setProperty("--player-color", color);
        playerEl.setAttribute(
          "title",
          `${player.username} (${
            player.isActive ? "Online" : "Offline"
          }) - Life: ${life}/4`
        );

        // Create background for life indicator
        const background = document.createElement("div");
        background.className = "player-background";
        playerEl.appendChild(background);

        // Create content area
        const content = document.createElement("div");
        content.className = "player-content";
        content.textContent = player.username.charAt(0).toUpperCase();
        playerEl.appendChild(content);

        gameContainer.appendChild(playerEl);
        playerElements[username] = playerEl;
      }

      function updatePlayerElement(username, player) {
        if (playerElements[username]) {
          const playerEl = playerElements[username];
          const life = player.life || 4;

          playerEl.style.left = `${player.x}px`;
          playerEl.style.top = `${player.y}px`;
          playerEl.className = `player life-${life} ${
            player.isActive ? "" : "inactive"
          }`;
          playerEl.setAttribute(
            "title",
            `${player.username} (${
              player.isActive ? "Online" : "Offline"
            }) - Life: ${life}/4`
          );

          // Update speech bubble position if it exists
          if (speechBubbles[username]) {
            updateSpeechBubblePosition(username, player.x, player.y);
          }
        }
      }

      function createSpeechBubble(username, message) {
        // Remove existing speech bubble if any
        if (speechBubbles[username]) {
          gameContainer.removeChild(speechBubbles[username]);
          delete speechBubbles[username];
        }

        const player = playerElements[username];
        if (!player) return;

        const bubble = document.createElement("div");
        bubble.className = "speech-bubble";
        bubble.textContent = message;

        const playerX = parseInt(player.style.left);
        const playerY = parseInt(player.style.top);

        bubble.style.left = `${playerX}px`;
        bubble.style.top = `${playerY - 60}px`;

        gameContainer.appendChild(bubble);
        speechBubbles[username] = bubble;

        // Show the bubble with animation
        setTimeout(() => {
          bubble.classList.add("show");
        }, 10);
      }

      function updateSpeechBubblePosition(username, x, y) {
        if (speechBubbles[username]) {
          speechBubbles[username].style.left = `${x}px`;
          speechBubbles[username].style.top = `${y - 60}px`;
        }
      }

      // Socket events
      socket.on("gameState", (players) => {
        // Store my username
        myUsername = usernameInput.value.trim();

        // Show game UI
        loginContainer.style.display = "none";
        gameContainer.style.display = "block";
        controls.style.display = "block";
        chatContainer.style.display = "block";
        playersList.style.display = "block";

        // Clear game container
        gameContainer.innerHTML = "";
        playerElements = {};
        speechBubbles = {};

        // Create player elements
        Object.keys(players).forEach((username) => {
          createPlayerElement(username, players[username]);
        });

        // Reset door state when joining game
        if (doorElement) {
          removeDoor();
        }

        updatePlayersList(players);
      });

      socket.on("playerStatusChanged", (data) => {
        const { username, action } = data;

        if (action === "joined") {
          if (!playerElements[username]) {
            createPlayerElement(username, data);
          } else {
            updatePlayerElement(username, data);
          }
        } else if (action === "left") {
          updatePlayerElement(username, data);
        }

        // Update the players list with current state
        const currentPlayers = {};
        Object.keys(playerElements).forEach((name) => {
          const el = playerElements[name];
          currentPlayers[name] = {
            username: name,
            x: parseInt(el.style.left),
            y: parseInt(el.style.top),
            isActive: !el.classList.contains("inactive"),
            lastSeen: data.username === name ? data.lastSeen : Date.now(),
            life: data.username === name ? data.life : 4,
          };
        });

        updatePlayersList(currentPlayers);
      });

      socket.on("playerMoved", (player) => {
        updatePlayerElement(player.username, player);

        // Update players list (simplified - just update positions)
        const playerItem = document.querySelector(
          `.player-item:has(strong:contains("${player.username}"))`
        );
        if (playerItem) {
          playerItem.innerHTML = playerItem.innerHTML.replace(
            /\(\d+, \d+\)/,
            `(${player.x}, ${player.y})`
          );
        }
      });

      socket.on("playerRemoved", (username) => {
        if (playerElements[username]) {
          gameContainer.removeChild(playerElements[username]);
          delete playerElements[username];

          // Remove speech bubble if it exists
          if (speechBubbles[username]) {
            gameContainer.removeChild(speechBubbles[username]);
            delete speechBubbles[username];
          }

          // Remove from players list
          const playerItem = document.querySelector(
            `.player-item:has(strong:contains("${username}"))`
          );
          if (playerItem) {
            playerItem.remove();
          }
        }
      });

      socket.on("chatMessage", (data) => {
        createSpeechBubble(data.username, data.message);

        // Check for door keyword
        if (checkForDoorKeyword(data.message)) {
          createDoor();
        }
      });

      function createDoor() {
        if (doorElement) return; // Door already exists

        doorElement = document.createElement("div");
        doorElement.className = "door";
        gameContainer.appendChild(doorElement);

        // Show the door with animation
        setTimeout(() => {
          doorElement.classList.add("show");
        }, 10);

        console.log("Door appeared!");
      }

      function removeDoor() {
        if (doorElement) {
          doorElement.classList.remove("show");
          setTimeout(() => {
            if (doorElement && doorElement.parentNode) {
              gameContainer.removeChild(doorElement);
              doorElement = null;
            }
          }, 300); // Wait for fade out animation
          console.log("Door disappeared!");
        }
      }

      function checkForDoorKeyword(message) {
        const keywords = ["door", "Door", "DOOR"];
        return keywords.some((keyword) => message.includes(keyword));
      }

      socket.on("doorTriggered", () => {
        createDoor();
      });

      socket.on("doorRemoved", () => {
        removeDoor();
      });
    </script>
  </body>
</html>
